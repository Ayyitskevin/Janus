[project]
name = "janus-gates"
version = "0.1.0"
description = "A local-first ledger of the decisions an AI fleet is waiting on a human to make"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.26.0", "pytest==9.1.1"]

[project.scripts]
janus = "janus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janus = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
