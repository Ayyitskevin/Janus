name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Janus's declared floor; 3.14 is the current stable line.
        # Source: https://www.python.org/downloads/
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Current majors and permissions:
      # https://github.com/actions/checkout
      # https://github.com/actions/setup-python
      # Full SHAs follow GitHub's action-pinning guidance:
      # https://docs.github.com/en/actions/tutorials/build-and-test-code/python
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Janus and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run repository gate
        run: ./scripts/check.sh
